<?xml version="1.0" encoding="utf-8"?>
<!-- UniFi-inspired isometric client/laptop icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Shadow -->
  <ellipse cx="100" cy="145" rx="60" ry="12" fill="#000000" opacity="0.2"/>

  <!-- Laptop base (keyboard section) -->
  <!-- Right face of base -->
  <path d="M100,130 L160,100 L160,95 L100,125 Z" fill="#6885A9"/>
  <!-- Left face of base -->
  <path d="M100,130 L40,100 L40,95 L100,125 Z" fill="#B5C5DC"/>
  <!-- Top of base (keyboard) -->
  <path d="M40,95 L100,65 L160,95 L100,125 Z" fill="#CDD9EE"/>

  <!-- Keyboard detail lines -->
  <line x1="55" y1="90" x2="85" y2="73" stroke="#B5C5DC" stroke-width="1.5"/>
  <line x1="60" y1="95" x2="90" y2="78" stroke="#B5C5DC" stroke-width="1.5"/>
  <line x1="65" y1="100" x2="95" y2="83" stroke="#B5C5DC" stroke-width="1.5"/>

  <!-- Screen (angled back) -->
  <!-- Screen back face -->
  <path d="M45,92 L100,62 L155,92 L155,45 L100,15 L45,45 Z" fill="#6885A9"/>
  <!-- Screen front face (display) -->
  <path d="M50,88 L100,60 L150,88 L150,48 L100,20 L50,48 Z" fill="#4A5568"/>
  <!-- Screen content area -->
  <path d="M55,82 L100,57 L145,82 L145,52 L100,27 L55,52 Z" fill="#2D3748"/>

  <!-- Screen glare -->
  <path d="M60,75 L85,60 L85,50 L60,65 Z" fill="#FFFFFF" opacity="0.15"/>

  <!-- Outline -->
  <path d="M40,95 L100,65 L160,95 L160,100 L100,130 L40,100 Z"
        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
  <path d="M45,92 L100,62 L155,92 L155,45 L100,15 L45,45 Z"
        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
</svg>
