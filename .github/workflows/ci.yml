name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Typecheck (pyright)
        run: pyright

  complexity:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Xenon complexity check
        run: python -m xenon src/unifi_network_maps --max-absolute C --max-modules B --max-average A
      - name: Max complexity 14
        run: |
          # Check for functions with complexity > 14
          high_complexity=$(python -m radon cc src/unifi_network_maps -s | grep -E " - C \(1[5-9]\)| - C \(20\)| - D \(| - E \(| - F \(" || true)
          if [ -n "$high_complexity" ]; then
            echo "Functions with complexity > 14 found:"
            echo "$high_complexity"
            exit 1
          fi

  test-unit:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, complexity]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Unit tests
        run: pytest -q -m unit

  test-integration:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Integration tests
        run: pytest -q -m integration

  test-contract:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Contract tests
        run: pytest -q -m contract

  bdd:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: BDD tests (behave)
        run: behave -q --no-capture

  test-acceptance:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Generate smoketest files
        run: |
          mkdir -p smoketest-mock
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --stdout > smoketest-mock/network_ports.mmd
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --include-clients --format svg-iso --output smoketest-mock/network_ports_clients_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg --svg-layout-mode grouped --output smoketest-mock/network_grouped.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg-iso --svg-layout-mode grouped --output smoketest-mock/network_grouped_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format mkdocs --include-clients --mkdocs-dual-theme --mkdocs-sidebar-legend --output smoketest-mock/unifi-network-dual-theme-and-clients.md
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg --wan-label "Odido" --wan-speed "1 Gbps" --output smoketest-mock/network_wan.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg-iso --wan-label "Odido" --wan-speed "1 Gbps" --wan2-label "Backup SFP+" --output smoketest-mock/network_wan_dual_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --theme unifi --format svg-iso --output smoketest-mock/theme_unifi_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --theme unifi-dark --format svg-iso --output smoketest-mock/theme_unifi_dark_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --theme minimal --format svg-iso --output smoketest-mock/theme_minimal_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --theme unifi --stdout > smoketest-mock/theme_unifi.mmd
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg-iso --icon-set isometric --output smoketest-mock/iconset_isometric_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format svg-iso --icon-set modern --output smoketest-mock/iconset_modern_iso.svg
      - name: Acceptance tests (visual regression, smoketest validation)
        run: pytest -q -m acceptance

  entrypoints:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
      - name: Module entrypoint
        run: python -m unifi_network_maps --help
      - name: Console entrypoint
        run: unifi-network-maps --help

  build:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install build -c constraints.txt
          python -m build

  update-examples:
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-contract, test-acceptance, bdd]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Regenerate example images
        run: |
          mkdir -p examples/output
          python -m unifi_network_maps.cli \
            --mock-data examples/mock_data.json \
            --include-ports --include-clients \
            --format svg-iso \
            --output examples/output/network_ports_clients_iso.svg
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/output/
          if git diff --staged --quiet; then
            echo "No changes to example images"
          else
            git commit -m "Update example images [skip ci]"
            git push
          fi
