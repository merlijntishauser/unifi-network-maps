        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
  <line x1="100" y1="90" x2="100" y2="130" stroke="#231F20" stroke-width="2"/>
  <line x1="100" y1="90" x2="50" y2="60" stroke="#231F20" stroke-width="2"/>
  <line x1="100" y1="90" x2="150" y2="60" stroke="#231F20" stroke-width="2"/>

