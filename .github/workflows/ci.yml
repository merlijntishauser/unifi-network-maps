name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Typecheck (pyright)
        run: pyright

  complexity:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Xenon complexity check
        run: python -m xenon src/unifi_network_maps --max-absolute C --max-modules B --max-average A
      - name: Max complexity 14
        run: |
          # Check for functions with complexity > 14
          high_complexity=$(python -m radon cc src/unifi_network_maps -s | grep -E " - C \(1[5-9]\)| - C \(20\)| - D \(| - E \(| - F \(" || true)
          if [ -n "$high_complexity" ]; then
            echo "Functions with complexity > 14 found:"
            echo "$high_complexity"
            exit 1
          fi

  test-unit:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, complexity]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Unit tests
        run: pytest -q -m unit

  test-integration:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Integration tests
        run: pytest -q -m integration

  test-contract:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Contract tests
        run: pytest -q -m contract

  bdd:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: BDD tests (behave)
        run: behave -q --no-capture

  test-acceptance:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Generate smoketest files
        run: make smoketest-mock
      - name: Acceptance tests (visual regression, smoketest validation)
        run: pytest -q -m acceptance

  entrypoints:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
      - name: Module entrypoint
        run: python -m unifi_network_maps --help
      - name: Console entrypoint
        run: unifi-network-maps --help

  build:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install build -c constraints.txt
          python -m build
