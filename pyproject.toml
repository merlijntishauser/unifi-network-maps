[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-mermaid-map"
version = "0.1.0"
description = "Dynamic UniFi -> Mermaid network maps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Merlijn" }]
dependencies = [
  "unifi-controller-api",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.scripts]
unifi-mermaid = "unifi_mermaid.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["unifi_mermaid"]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"unifi_mermaid" = ["assets/icons/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]
