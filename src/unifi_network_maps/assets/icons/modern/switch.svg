<?xml version="1.0" encoding="utf-8"?>
<!-- UniFi-inspired isometric switch icon (rack-mount style) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140">
  <!-- Shadow -->
  <ellipse cx="120" cy="125" rx="75" ry="15" fill="#000000" opacity="0.2"/>

  <!-- Isometric flat box - 1U rack style -->
  <!-- Right face (darker) - thin -->
  <path d="M120,105 L200,60 L200,45 L120,90 Z" fill="#6885A9"/>

  <!-- Left face (medium) - thin -->
  <path d="M120,105 L40,60 L40,45 L120,90 Z" fill="#B5C5DC"/>

  <!-- Top face (lightest) - wide -->
  <path d="M40,45 L120,10 L200,45 L120,90 Z" fill="#CDD9EE"/>

  <!-- Port indicators on top face (2 rows of 4) -->
  <rect x="55" y="35" width="8" height="5" fill="#231F20" transform="skewY(-30) skewX(0)"/>
  <rect x="70" y="35" width="8" height="5" fill="#231F20" transform="skewY(-30) skewX(0)"/>
  <rect x="85" y="35" width="8" height="5" fill="#231F20" transform="skewY(-30) skewX(0)"/>
  <rect x="100" y="35" width="8" height="5" fill="#231F20" transform="skewY(-30) skewX(0)"/>

  <!-- LED indicators -->
  <circle cx="65" cy="65" r="3" fill="#00A86B"/>
  <circle cx="80" cy="57" r="3" fill="#00A86B"/>
  <circle cx="95" cy="49" r="3" fill="#00A86B"/>

  <!-- Outline -->
  <path d="M40,45 L120,10 L200,45 L200,60 L120,105 L40,60 Z"
        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
  <line x1="120" y1="90" x2="120" y2="105" stroke="#231F20" stroke-width="2"/>
  <line x1="120" y1="90" x2="40" y2="45" stroke="#231F20" stroke-width="2"/>
  <line x1="120" y1="90" x2="200" y2="45" stroke="#231F20" stroke-width="2"/>
</svg>
