<?xml version="1.0" encoding="utf-8"?>
<!-- Isometric cube base + Heroicon computer-desktop with isometric matrix transform -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Shadow -->
  <ellipse cx="100" cy="145" rx="50" ry="12" fill="#000000" opacity="0.2"/>

  <!-- Isometric cube base -->
