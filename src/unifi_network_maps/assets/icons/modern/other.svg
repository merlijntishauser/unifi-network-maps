<?xml version="1.0" encoding="utf-8"?>
<!-- UniFi-inspired isometric generic device icon (small box/cube) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
  <!-- Shadow -->
  <ellipse cx="80" cy="125" rx="45" ry="12" fill="#000000" opacity="0.2"/>

  <!-- Isometric cube - generic device -->
  <!-- Right face (darker) -->
  <path d="M80,110 L130,80 L130,50 L80,80 Z" fill="#6885A9"/>

  <!-- Left face (medium) -->
  <path d="M80,110 L30,80 L30,50 L80,80 Z" fill="#B5C5DC"/>

  <!-- Top face (lightest) -->
  <path d="M30,50 L80,20 L130,50 L80,80 Z" fill="#CDD9EE"/>

  <!-- Status LED -->
  <circle cx="55" cy="75" r="4" fill="#00A86B"/>

  <!-- Ventilation slots on right face -->
  <line x1="90" y1="72" x2="115" y2="57" stroke="#4A5D7A" stroke-width="2"/>
  <line x1="90" y1="80" x2="115" y2="65" stroke="#4A5D7A" stroke-width="2"/>
  <line x1="90" y1="88" x2="115" y2="73" stroke="#4A5D7A" stroke-width="2"/>

  <!-- Outline -->
  <path d="M30,50 L80,20 L130,50 L130,80 L80,110 L30,80 Z"
        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
  <line x1="80" y1="80" x2="80" y2="110" stroke="#231F20" stroke-width="2"/>
  <line x1="80" y1="80" x2="30" y2="50" stroke="#231F20" stroke-width="2"/>
  <line x1="80" y1="80" x2="130" y2="50" stroke="#231F20" stroke-width="2"/>
</svg>
