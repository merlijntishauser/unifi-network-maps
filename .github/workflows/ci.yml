name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: |
          ruff check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Tests (pytest)
        run: |
          pytest

  mock-smoketest:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Mock smoketest
        run: |
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --stdout > /tmp/network_ports.mmd
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --include-clients --format svg-iso --output /tmp/network_ports_clients_iso.svg

  entrypoints:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
      - name: Module entrypoint
        run: |
          python -m unifi_network_maps --help
      - name: Console entrypoint
        run: |
          unifi-network-maps --help

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install build -c constraints.txt
          python -m build
