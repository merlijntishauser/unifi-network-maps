name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: |
          ruff check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Typecheck (pyright)
        run: |
          pyright

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Tests (pytest)
        run: |
          pytest

  bdd:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: BDD tests (behave)
        run: |
          behave

  contract:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Contract tests (fixtures)
        run: |
          pytest -q tests/test_contract_unifi.py

  mock-smoketest:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Mock smoketest
        run: |
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --stdout > /tmp/network_ports.mmd
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --include-ports --include-clients --format svg-iso --output /tmp/network_ports_clients_iso.svg
          python -m unifi_network_maps.cli --mock-data examples/mock_data.json --format mkdocs --include-clients --mkdocs-dual-theme --mkdocs-sidebar-legend --output /tmp/unifi-network-dual-theme-and-clients.md
          python - <<'PY'
          from pathlib import Path

          md = Path("/tmp/unifi-network-dual-theme-and-clients.md").read_text(encoding="utf-8")
          required = [
              "unifi-mermaid--light",
              "unifi-mermaid--dark",
              "unifi-legend--light",
              "unifi-legend--dark",
          ]
          missing = [entry for entry in required if entry not in md]
          if missing:
              raise SystemExit(f"Missing mkdocs dual-theme sections: {missing}")

          legend_js = Path("/tmp/assets/legend.js").read_text(encoding="utf-8")
          if 'querySelectorAll("[data-unifi-legend]")' not in legend_js:
              raise SystemExit("Sidebar legend script should use querySelectorAll.")
          PY

  entrypoints:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
      - name: Module entrypoint
        run: |
          python -m unifi_network_maps --help
      - name: Console entrypoint
        run: |
          unifi-network-maps --help

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements.txt
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install build -c constraints.txt
          python -m build
