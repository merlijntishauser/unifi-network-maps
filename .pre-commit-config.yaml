repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: .venv/bin/pyright
        language: system
        pass_filenames: false
      - id: xenon
        name: xenon complexity check
        entry: .venv/bin/xenon src/unifi_network_maps --max-absolute D --max-modules B --max-average A
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
      - id: behave
        name: behave
        entry: .venv/bin/behave -q --no-capture
        language: system
        pass_filenames: false
      - id: smoketest-mock
        name: smoketest-mock
        entry: make -s smoketest-mock
        language: system
        pass_filenames: false
      - id: smoketest-validate
        name: smoketest-validate
        entry: .venv/bin/pytest tests/test_smoketest_validation.py -q
        language: system
        pass_filenames: false
