<?xml version="1.0" encoding="utf-8"?>
<!-- UniFi-inspired isometric gateway icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <!-- Shadow -->
  <ellipse cx="100" cy="165" rx="60" ry="15" fill="#000000" opacity="0.2"/>

  <!-- Isometric box - UDM-style rounded rectangle -->
  <!-- Right face (darker) -->
  <path d="M100,140 L160,105 L160,55 L100,90 Z" fill="#6885A9"/>

  <!-- Left face (medium) -->
  <path d="M100,140 L40,105 L40,55 L100,90 Z" fill="#B5C5DC"/>

  <!-- Top face (lightest) -->
  <path d="M40,55 L100,20 L160,55 L100,90 Z" fill="#CDD9EE"/>

  <!-- Front LED strip -->
  <path d="M55,95 L100,120 L100,125 L55,100 Z" fill="#4FC3F7"/>

  <!-- Top ventilation lines -->
  <line x1="60" y1="50" x2="90" y2="33" stroke="#B5C5DC" stroke-width="2"/>
  <line x1="70" y1="55" x2="100" y2="38" stroke="#B5C5DC" stroke-width="2"/>
  <line x1="80" y1="60" x2="110" y2="43" stroke="#B5C5DC" stroke-width="2"/>

  <!-- Outline -->
  <path d="M40,55 L100,20 L160,55 L160,105 L100,140 L40,105 Z"
        fill="none" stroke="#231F20" stroke-width="2" stroke-linejoin="round"/>
  <line x1="100" y1="90" x2="100" y2="140" stroke="#231F20" stroke-width="2"/>
  <line x1="100" y1="90" x2="40" y2="55" stroke="#231F20" stroke-width="2"/>
  <line x1="100" y1="90" x2="160" y2="55" stroke="#231F20" stroke-width="2"/>
</svg>
