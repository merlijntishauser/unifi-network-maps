mermaid:
  nodes:
    gateway:
      fill: "#5c3b00"
      stroke: "#ffb347"
    switch:
      fill: "#0f2b3d"
      stroke: "#5dade2"
    ap:
      fill: "#0f3b2d"
      stroke: "#2ecc71"
    client:
      fill: "#2b1f3b"
      stroke: "#b084ff"
    other:
      fill: "#2a2a2a"
      stroke: "#9e9e9e"
    wan:
      fill: "#0f2b3d"
      stroke: "#64b5f6"
  node_text: "#f5f5f5"
  edge_label_border: "#e6e6e6"
  edge_label_border_width: 2
  poe_link: "#64b5f6"
  poe_link_width: 2
  poe_link_arrow: "none"
  standard_link: "#66bb6a"
  standard_link_width: 2
  standard_link_arrow: "none"
svg:
  icon_set: modern
  background: "#1a1a1a"
  wan_background: "#1e3a5f"
  text:
    primary: "#f5f5f5"
    secondary: "#f5f5f5"
  status:
    online: "#66bb6a"
    offline: "#ef5350"
  node_side_left: "#5a5a5a"
  node_side_right: "#4a4a4a"
  links:
    standard:
      from: "#66bb6a"
      to: "#2e7d32"
    poe:
      from: "#64b5f6"
      to: "#1e88e5"
  nodes:
    gateway:
      from: "#ffb347"
      to: "#e69530"
    switch:
      from: "#5dade2"
      to: "#3498db"
    ap:
      from: "#58d68d"
      to: "#2ecc71"
    client:
      from: "#bb8fce"
      to: "#9b59b6"
    other:
      from: "#7f8c8d"
      to: "#6a7b7c"
    # Extended device types - purple tint for consistency
    camera:
      from: "#bb8fce"
      to: "#9b59b6"
    tv:
      from: "#bb8fce"
      to: "#9b59b6"
    phone:
      from: "#bb8fce"
      to: "#9b59b6"
    printer:
      from: "#bb8fce"
      to: "#9b59b6"
    nas:
      from: "#bb8fce"
      to: "#9b59b6"
    speaker:
      from: "#bb8fce"
      to: "#9b59b6"
    game_console:
      from: "#bb8fce"
      to: "#9b59b6"
    iot:
      from: "#bb8fce"
      to: "#9b59b6"
  # VLAN color overrides (brighter for dark mode)
  vlan_colors:
    1: "#95a5a6"      # Default/management - light gray
    10: "#ff6b6b"     # IoT - bright red
    20: "#5dade2"     # Guest - bright blue
    30: "#f7dc6f"     # Trusted - bright yellow
    100: "#bb8fce"    # Security/cameras - bright purple
