[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-network-maps"
version = "2.2.0"
description = "Dynamic UniFi -> network maps in mermaid or svg"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merlijn Tishauser" }]
keywords = ["unifi", "mermaid", "network", "topology", "diagram", "svg"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Home Automation",
  "Topic :: System :: Networking",
]
dependencies = [
  "unifi-topology>=2.1.0",
  "PyYAML==6.0.3",
  "Jinja2==3.1.6",
]

[project.urls]
Homepage = "https://github.com/merlijntishauser/unifi-network-maps"
Repository = "https://github.com/merlijntishauser/unifi-network-maps"
Issues = "https://github.com/merlijntishauser/unifi-network-maps/issues"
Changelog = "https://github.com/merlijntishauser/unifi-network-maps/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "cairosvg==2.9.0",
  "Faker==40.11.1",
  "behave==1.3.3",
  "Pillow==12.1.1",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "pytest-cov==7.1.0",
  "pyright==1.1.408",
  "radon==6.0.1",
  "ruff==0.15.7",
  "xenon==0.9.3"
]

[project.scripts]
unifi-network-maps = "unifi_network_maps.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

# Xenon enforces cyclomatic complexity thresholds:
# A=1-5 (simple), B=6-10 (low), C=11-20 (moderate), D=21-30 (high), E=31-40 (very high), F=41+ (error-prone)
# Run: xenon src/unifi_network_maps --max-absolute C --max-modules B --max-average A
# For detailed analysis: radon cc src/unifi_network_maps -a -s

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = []
# Remove --cov from here so it doesn't conflict with PyCharm's runner
addopts = "-ra"
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests involving multiple components working together",
    "acceptance: End-to-end validation (visual regression, smoketests)",
]

[tool.coverage.run]
branch = true
source = ["unifi_network_maps"]

[tool.coverage.paths]
source = [
    "src/unifi_network_maps",
    "*/site-packages/unifi_network_maps",
]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"unifi_network_maps" = [
  "render/templates/*.j2",
]

[tool.setuptools.packages.find]
where = ["src"]
