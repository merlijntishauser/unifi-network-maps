<?xml version="1.0" encoding="utf-8"?>
<!-- UniFi-inspired isometric access point icon (ceiling-mount disc style) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Shadow -->
  <ellipse cx="100" cy="145" rx="55" ry="14" fill="#000000" opacity="0.2"/>

  <!-- Isometric disc - UniFi AP style -->
  <!-- Bottom ellipse (darker edge) -->
  <ellipse cx="100" cy="95" rx="55" ry="28" fill="#6885A9"/>

  <!-- Side band (medium) -->
  <path d="M45,85 Q45,95 100,123 Q155,95 155,85" fill="#B5C5DC"/>

  <!-- Top ellipse (lightest) -->
  <ellipse cx="100" cy="85" rx="55" ry="28" fill="#CDD9EE"/>

  <!-- Inner ring detail -->
  <ellipse cx="100" cy="85" rx="35" ry="18" fill="none" stroke="#B5C5DC" stroke-width="2"/>

  <!-- Center LED indicator -->
  <ellipse cx="100" cy="85" rx="8" ry="4" fill="#4FC3F7"/>

  <!-- Outline -->
  <ellipse cx="100" cy="85" rx="55" ry="28" fill="none" stroke="#231F20" stroke-width="2"/>
  <path d="M45,85 L45,95 Q45,105 100,133 Q155,105 155,95 L155,85"
        fill="none" stroke="#231F20" stroke-width="2"/>
</svg>
